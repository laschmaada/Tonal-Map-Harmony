name: Windows build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: cmd
        run: |
          cmake --version
          REM We deliberately do NOT probe for cl here: the runner image may
          REM not have cl on PATH until vcvars64.bat is sourced, and a failed
          REM probe would short-circuit the step. The Configure step sources
          REM vcvars via the script which does the real check.

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-${{ hashFiles('CMakeLists.txt', 'plugin/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-

      - name: Install VST3 SDK
        shell: cmd
        run: |
          REM JUCE 7's VST3 wrapper includes the VST2 SDK headers
          REM (pluginterfaces/vst2.x/*) for backwards-compat shims, even
          REM when only building the VST3 format. The windows-2025-vs2026
          REM image doesn't ship the VST3 SDK, so we clone a shallow copy
          REM and point CMake at it via VST3_SDK_DIR.
          if not exist "C:\vst3sdk" (
              git clone --depth=1 https://github.com/steinbergmedia/vst3sdk.git C:\vst3sdk
          )
          echo VST3_SDK_DIR=C:\vst3sdk >> $GITHUB_ENV

      - name: Configure
        shell: cmd
        run: |
          call scripts\configure.bat

      - name: Build
        shell: cmd
        run: |
          call scripts\build.bat

      - name: Upload VST3 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: midi-chord-pad-vst3
          path: build/VST3/MidiChordPad.vst3
          if-no-files-found: error
