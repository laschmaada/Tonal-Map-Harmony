name: Windows build + tests

on:
  push:
    branches: [master, fix/**]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: cmd
        run: |
          cmake --version
          REM We deliberately do NOT probe for cl here: the runner image may
          REM not have cl on PATH until vcvars64.bat is sourced, and a failed
          REM probe would short-circuit the step. configure.bat does the
          REM real check via its VCVARS lookup.

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-mcp-${{ hashFiles('CMakeLists.txt', 'plugin/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-mcp-

      - name: Configure
        shell: cmd
        run: |
          call scripts\configure.bat

      - name: Build
        shell: cmd
        run: |
          call scripts\build.bat

      - name: Run tests
        shell: cmd
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: midi-chord-pad-vst3
          path: build/VST3/VST3/MIDI Chord Pad.vst3
          if-no-files-found: error